<!DOCTYPE html>
<html>

<head>
    <title>Employee Registration Form</title>

</head>

<body>

    <div class="aa">

        <h1 class="heading">
            EMPLOYEE REGISTRATION FORM
        </h1>

        <form>
            <table>

                <tr>
                    <td>
                        <label>ID</label>
                    </td>

                    <td>
                        <input type="text" id="inp1">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>NAME</label>
                    </td>

                    <td>
                        <input type="text" id="inp2">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>ROLE</label>
                    </td>

                    <td>
                        <input type="text" id="inp3">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>SAL</label>
                    </td>

                    <td>
                        <input type="text" id="inp4">
                    </td>
                </tr>

            </table>

            <br>

            <button type="button" id="addBtn">
                    ADD
                </button>
            <br>
            <br>
            <table border="1" width="100%" id="employeeTable">

                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>ROLE</th>
                    <th>SAL</th>
                    <th>EDIT</th>
                    <th>DELETE</th>
                </tr>

            </table>

        </form>

    </div>

    <script src="class.js"></script>

</body>

</html>
