<!DOCTYPE html>
<html>

<head>
    <title>Document</title>

</head>

<body>

    <div class="aa">

        <div class="container">
            <h1 class="heading" style="margin-left: 300px;">
                STUDENT REGISTRATION FORM
            </h1>
        </div>

        <FORM>

            <fieldset>
                <legend> Student Details Form</legend>

                <TABLE>

                    <tr>
                        <td><label>ROLL NUMBER</label></td>
                        <TD>
                            <INPUT type="text" placeholder="Enter TheRoll NUm" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>STUDENT NAME</label></td>
                        <TD>
                            <INPUT type="text" placeholder="Enter The student name" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>FATHER NAME</label></td>
                        <TD>
                            <INPUT type="text" placeholder="Enter The Father name" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>DATE OF BIRTH</label></td>
                        <TD>
                            <INPUT type="DATE" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>MOBILE NUMBER</label></td>
                        <TD>
                            <INPUT type="NUMBER" placeholder="Enter Mobile Number" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>Email Id</label></td>
                        <TD>
                            <INPUT type="Email" placeholder="Enter The Email" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>PASSWORD</label></td>
                        <TD>
                            <INPUT type="PASSWORD" placeholder="Enter The Password" />
                        </TD>
                    </tr>

                    <tr>
                        <td><label>LANGUAGE</label></td>
                        <TD>
                            <INPUT type="CHECKBOX" NAME="LANGUAGE" />KANNADA
                            <INPUT type="CHECKBOX" NAME="LANGUAGE" />HINDI
                            <INPUT type="CHECKBOX" NAME="LANGUAGE" />ENGLISH
                            <INPUT type="CHECKBOX" NAME="LANGUAGE" />MARATHI
                        </TD>
                    </tr>

                    <tr>
                        <td><label>GENDER</label></td>
                        <TD>
                            <INPUT type="RADIO" NAME="GENDER" />MALE
                            <INPUT type="RADIO" NAME="GENDER" />FEMALE
                            <INPUT type="RADIO" NAME="GENDER" />OTHER
                        </TD>
                    </tr>

                    <tr>
                        <td><label>DEPARTMENT</label></td>
                        <TD>
                            <INPUT type="CHECKBOX" NAME="DEPARTMENT" />CSE
                            <INPUT type="CHECKBOX" NAME="DEPARTMENT" />EEE
                            <INPUT type="CHECKBOX" NAME="DEPARTMENT" />ECE
                            <INPUT type="CHECKBOX" NAME="DEPARTMENT" />CIVIL
                        </TD>
                    </tr>

                    <tr>
                        <TD>
                            <LABEL>COURSE</LABEL>
                        </TD>
                        <TD>
                            <SELECT> 
                                <OPTION>.....SELECT COURSE.....</OPTION> 
                                <OPTION>JAVA</OPTION> 
                                <OPTION>PYTHON</OPTION> 
                                <OPTION>WEB</OPTION> 
                            </SELECT>
                        </TD>
                    </tr>

                    <TR>
                        <td><label>SELECT PHOTO</label></td>
                        <TD>
                            <INPUT type="FILE" />
                        </TD>
                    </TR>

                    <TR>
                        <td><label>CITY</label></td>
                        <TD>
                            <INPUT type="TEXT" placeholder="Enter The City" />
                        </TD>
                    </TR>

                    <TR>
                        <td><label>ADDRESS</label></td>
                        <TD>
                            <TEXTAREA rows="4" cols="20" placeholder="Enter The Address"></TEXTAREA>
                        </TD>
                    </TR>

                </TABLE>

            </fieldset>



            <div class="btn">
                <button type="submit" class="abc">ADD</button>
            </div>

            <br><br>

            <table border="1" width="50%">

                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>SAL</th>
                    <th>ADDRESS</th>
                    <th>ROLE</th>
                </tr>

            </table>

        </FORM>

    </div>

</body>

</html>
