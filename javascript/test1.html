<!DOCTYPE html>
<html lang="en">

<head>
    <title>Boolean</title>
</head>

<body>

    //Boolean //Falsy values
    <script>
        console.log(Boolean(0))
        console.log(Boolean(false))
        console.log(Boolean(null))
        console.log(Boolean(undefined))
        console.log(Boolean(''))
        console.log(Boolean(NaN))


        //Truly values
        console.log(Boolean('hello'))
        console.log(Boolean(' '))
        console.log(Boolean('null'))
        console.log(Boolean('false'))
        console.log(Boolean(true))
        console.log(Boolean(null + 10))
        console.log(Boolean(null + undefined)) //false
        console.log(Boolean("hello" + null))
        console.log(Boolean('true' - 0)) //false
        console.log(Boolean(true + 0))

        //type coercion (implicit)

        let a = 10; //number
        let b = true; //
        console.log(Boolean(a + b));
    </script>

</body>

</html>
