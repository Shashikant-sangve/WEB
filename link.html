<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Links</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
        .shop-link { 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            color: white; 
            font-weight: bold; 
        }
        .amazon { background-color: #ff9900; }
        .flipkart { background-color: #2874f0; }
        .myntra { background-color: #ff3f6c; }
    </style>
</head>
<body>

    <a href="https://amazon.com" target="_blank" class="shop-link amazon">Amazon</a>
    <a href="https://flipkart.com" target="_blank" class="shop-link flipkart">Flipkart</a>
    <a href="https://myntra.com" target="_blank" class="shop-link myntra">Myntra</a>

</body>
</html>
