<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <link href="C:\Users\sangv\OneDrive\Desktop\WEB\bootstrap-5.3.8-dist\css\bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            height: 550px;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 10px;
        }
        
        .items {
            background-color: brown;
            color: white;
            border: 2px solid black;
        }
        
        .three {
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 3;
        }
        
        .four {
            grid-column: 1/3;
            grid-row: 2/3;
        }
        
        .six {
            grid-column: 2/4;
            grid-row: 3/4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items one">1</div>
        <div class="items two">2</div>
        <div class="items three">3</div>
        <div class="items four">4</div>
        <div class="items five">5</div>
        <div class="items six">6</div>
    </div>


    <br>

    <button type="button" class="btn btn-primary">Primary</button>
    <button type="button" class="btn btn-secondary">Secondary</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-danger">Danger</button>
    <button type="button" class="btn btn-warning">Warning</button>
    <button type="button" class="btn btn-info">Info</button>
    <button type="button" class="btn btn-light">Light</button>
    <button type="button" class="btn btn-dark">Dark</button>

    <button type="button" class="btn btn-link">Link</button>
</body>

</html>
