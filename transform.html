<!DOCTYPE html>
<html lang="en">
<head>
    <title>transition</title>
    <style>

        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .container 
        {
            width:300px;
            height:300px;
            margin:100px auto;
            position: relative;
            overflow:hidden;
        }

        /* Main Image */
        .container > img 
        {
            width:100%;
            height:100%;
            display:block;
            filter:grayscale(100%);
            transition:all 1s linear 3s;
        }
        .container:hover > img 
        {
            filter:grayscale(0%);
            transform:scale(1.2);
        }

        .container:hover 
        {
            cursor:pointer;
        }

        /* Wrapper */
        #wrapper-ele
        {
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color:rgb(211, 246, 12);
            transition:all 1.2s linear 2.5s;
            z-index:2;
        }
        .container:hover > #wrapper-ele
        {
            transform:translateY(-100%);
        }

        /* Curtain (Right → Left) */
        #curtun
        {
            position:absolute;
            top:0;
            right:0;
            width:100%;
            height:100%;
            z-index:3;
            transition:all 1.3s ease 1.5s;
        }

        #curtun img
        {
            width:100%;
            height:100%;
            display:block;
            object-fit:cover;
        }

        .container:hover > #curtun
        {
            transform:translateX(-100%);
        }

        /* Left Door */
        #left-door
        {
            position:absolute;
            top:0;
            left:0;
            width:50%;
            height:100%;
            background:rgb(255, 162, 0);
            transform-origin:left;
            transition:all 1s ease 0.5s;
            z-index:4;
        }
        .container:hover > #left-door
        {
            transform:perspective(400px) rotateY(90deg);
        }

        /* Right Door */
        #right-door
        {
            position:absolute;
            top:0;
            left:50%;
            width:50%;
            height:100%;
            background:rgb(249, 154, 2);
            transform-origin:right;
            transition:all 1s ease 0.5s;
            z-index:4;
        }
        .container:hover > #right-door
        {
            transform:perspective(400px) rotateY(-90deg);
        }

    </style>
</head>
<body>

<div class="container">

    <img src="https://4kwallpapers.com/images/wallpapers/adiyogi-lord-shiva-768x1024-14420.png">

    <div id="wrapper-ele"></div>

    <div id="curtun">
        <img src="https://wallpaperaccess.com/full/4477463.png">
    </div>

    <div id="left-door"></div>
    <div id="right-door"></div>

</div>

</body>
</html>
